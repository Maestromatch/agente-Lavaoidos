<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Pago exitoso!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0fdf4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; color: #166534; margin-bottom: 0.75rem; }
    p  { font-size: 0.95rem; color: #555; line-height: 1.6; }
    .sub { margin-top: 1.25rem; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>¡Reserva confirmada!</h1>
    <p>Tu pago fue procesado correctamente. Recibirás una confirmación por WhatsApp en los próximos minutos con todos los detalles de tu cita.</p>
    <p class="sub">Puedes cerrar esta ventana.</p>
  </div>
</body>
</html>
