<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago no procesado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fef2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; color: #991b1b; margin-bottom: 0.75rem; }
    p  { font-size: 0.95rem; color: #555; line-height: 1.6; }
    .sub { margin-top: 1.25rem; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">❌</div>
    <h1>El pago no pudo procesarse</h1>
    <p>Algo salió mal con tu pago. Por favor vuelve a WhatsApp y escríbenos para que te enviemos un nuevo link de pago.</p>
    <p class="sub">Tu reserva no fue eliminada. El link sigue activo por 24 horas.</p>
  </div>
</body>
</html>
